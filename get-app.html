<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>Download Debt Tracker</title>
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #eef2f7; color: #0f172a; padding: 24px;
    }
    .card {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 20px;
      box-shadow: 0 12px 30px -12px rgba(15,23,42,.25);
      max-width: 400px; width: 100%; padding: 32px 26px; text-align: center;
    }
    .logo { font-size: 2.8rem; line-height: 1; margin-bottom: 8px; }
    h1 { margin: 0 0 4px; font-size: 1.4rem; font-weight: 800; letter-spacing: -.02em; }
    .msg { margin: 6px 0 20px; color: #64748b; font-size: .92rem; }
    .btn {
      display: inline-block; background: #0f766e; color: #fff; text-decoration: none;
      font-weight: 700; padding: 13px 22px; border-radius: 12px; font-size: 1rem;
      box-shadow: 0 8px 20px -8px rgba(15,118,110,.5);
    }
    .btn:active { filter: brightness(1.1); }
    .note { margin: 22px 0 0; font-size: .76rem; color: #64748b; line-height: 1.6; }
    .note a { color: #0f766e; font-weight: 600; }
  </style>
  <!-- Cloudflare Web Analytics — this page's views = APK download count -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "6e128fc0e8d84f66aa7cfa9da3234949"}'></script>
</head>
<body>
  <div class="card">
    <div class="logo">💰</div>
    <h1>Debt Tracker</h1>
    <p class="msg" id="msg">Your download is starting…</p>
    <a class="btn" id="dl" href="./debt-tracker.apk" download="debt-tracker.apk">Download didn't start? Tap here</a>
    <p class="note">
      <b>Android:</b> open the downloaded file and allow “install from unknown sources” when asked.<br>
      <b>iPhone can't install APKs</b> — <a href="./index.html">open the web app</a> instead (Safari → Share → Add to Home Screen).
    </p>
  </div>
  <script>
    // Auto-start the download without navigating away (keeps the page + beacon alive).
    window.addEventListener("load", function () {
      setTimeout(function () {
        try { document.getElementById("dl").click(); } catch (e) {}
      }, 600);
    });
  </script>
</body>
</html>
