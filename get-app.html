<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>Get Debt Tracker</title>
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #eef2f7; color: #0f172a; padding: 24px;
    }
    .card {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 20px;
      box-shadow: 0 12px 30px -12px rgba(15,23,42,.25);
      max-width: 400px; width: 100%; padding: 30px 26px; text-align: center;
    }
    .logo { font-size: 2.8rem; line-height: 1; margin-bottom: 8px; }
    h1 { margin: 0 0 6px; font-size: 1.35rem; font-weight: 800; letter-spacing: -.02em; }
    .msg { margin: 6px 0 18px; color: #64748b; font-size: .92rem; line-height: 1.5; }
    .btn {
      display: inline-block; background: #0f766e; color: #fff; text-decoration: none;
      font-weight: 700; padding: 13px 22px; border-radius: 12px; font-size: 1rem;
      box-shadow: 0 8px 20px -8px rgba(15,118,110,.5);
    }
    .btn:active { filter: brightness(1.1); }
    .note { margin: 20px 0 0; font-size: .78rem; color: #64748b; line-height: 1.6; }
    .note a { color: #0f766e; font-weight: 600; }
    .steps { text-align: left; margin: 0 auto 20px; max-width: 300px; padding-left: 20px; color: #334155; font-size: .95rem; line-height: 1.7; }
    .steps b { color: #0f172a; }
  </style>
  <!-- Cloudflare Web Analytics — views of this page = download/install intent count -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "6e128fc0e8d84f66aa7cfa9da3234949"}'></script>
</head>
<body>
  <div class="card" id="card"></div>
  <script>
    (function () {
      var isIOS =
        /iP(hone|od|ad)/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPadOS
      var card = document.getElementById("card");

      if (isIOS) {
        // iPhone/iPad can't install an APK — guide them to install the web app.
        card.innerHTML =
          '<div class="logo">💰</div>' +
          '<h1>Install on iPhone</h1>' +
          '<p class="msg">iPhone can’t use Android files, so install the web app instead — ' +
          'it works offline and behaves like a real app:</p>' +
          '<ol class="steps">' +
          '<li>Open this page in <b>Safari</b> (if it isn’t already).</li>' +
          '<li>Tap the <b>Share</b> button (the square with an up-arrow).</li>' +
          '<li>Choose <b>Add to Home Screen</b>.</li>' +
          '</ol>' +
          '<a class="btn" href="./index.html">Open the app now</a>' +
          '<p class="note">Then open it from your Home Screen like any app.</p>';
      } else {
        // Android / desktop → offer the APK and auto-start the download.
        card.innerHTML =
          '<div class="logo">💰</div>' +
          '<h1>Debt Tracker</h1>' +
          '<p class="msg" id="msg">Your download is starting…</p>' +
          '<a class="btn" id="dl" href="./debt-tracker.apk" download="debt-tracker.apk">Download didn’t start? Tap here</a>' +
          '<p class="note"><b>Android:</b> open the downloaded file and allow ' +
          '“install from unknown sources” when asked.<br>' +
          'On a computer? <a href="./index.html">Open the web app</a> instead.</p>';
        setTimeout(function () {
          try { document.getElementById("dl").click(); } catch (e) {}
        }, 600);
      }
    })();
  </script>
</body>
</html>
